x-lp: &lp
  build: .
  command: ["--config", "/etc/limitplane/config.json", "--redis", "redis://redis:6379", "--upstream", "http://origin:80", "--trust-proxy"]
  volumes:
    - ./limitplane.example.json:/etc/limitplane/config.json:ro
  depends_on:
    redis:
      condition: service_healthy
    origin:
      condition: service_started

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
  origin:
    image: nginx:alpine
  limitplane1:
    <<: *lp
  limitplane2:
    <<: *lp
  lb:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - limitplane1
      - limitplane2
