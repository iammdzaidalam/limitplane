upstream limitplane {
    server limitplane1:8080;
    server limitplane2:8080;
}
server {
    listen 80;
    location / {
        proxy_pass http://limitplane;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        add_header X-Served-By $upstream_addr always;
    }
}
