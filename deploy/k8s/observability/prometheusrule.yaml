apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: limitplane
  labels: {app: limitplane}
spec:
  groups:
    - name: limitplane
      rules:
        - alert: LimitPlaneHighBlockRate
          expr: |
            sum(rate(limitplane_decisions_total{service="limitplane",reason=~"burst|monthly|banned"}[5m]))
              / sum(rate(limitplane_decisions_total{service="limitplane"}[5m])) > 0.2
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: More than 20% of requests are being rate limited.
        - alert: LimitPlaneRedisDegraded
          expr: sum(rate(limitplane_degraded_total{service="limitplane"}[5m])) > 0
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: Redis is unreachable and replicas fall back to local limits, so the effective limit is multiplied by the replica count.
        - alert: LimitPlaneBackendErrors
          expr: sum(rate(limitplane_decisions_total{service="limitplane",reason="error"}[5m])) > 0
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: Redis is unreachable and fail-closed is returning 503s.
        - alert: LimitPlaneTenantQuotaExhausted
          expr: sum by (tenant) (increase(limitplane_decisions_total{service="limitplane",reason="monthly"}[15m])) > 0
          labels: {severity: warning}
          annotations:
            summary: Tenant {{ $labels.tenant }} has used its monthly quota and is being blocked.
