apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.limitplane.dev
spec:
  group: limitplane.dev
  scope: Namespaced
  names:
    kind: Tenant
    listKind: TenantList
    plural: tenants
    singular: tenant
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: ID
          type: string
          jsonPath: .spec.id
        - name: Tier
          type: string
          jsonPath: .spec.tier
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Used
          type: integer
          jsonPath: .status.monthlyUsed
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: A customer of the API. Its key lives in a Secret, never in the Tenant itself.
          properties:
            spec:
              type: object
              required: [id, tier, keySecretRef]
              properties:
                id: {type: string, minLength: 1, description: 'Tenant id used in metrics, quotas and the dashboard.'}
                tier: {type: string, minLength: 1, description: 'A tier of the applied RateLimitPolicy.'}
                keySecretRef:
                  type: object
                  required: [name, key]
                  properties:
                    name: {type: string, minLength: 1}
                    key: {type: string, minLength: 1}
            status:
              type: object
              properties:
                observedGeneration: {type: integer, format: int64}
                monthlyUsed: {type: integer, format: int64, description: 'Best effort, written by the leader.'}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ["True", "False", "Unknown"]}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
