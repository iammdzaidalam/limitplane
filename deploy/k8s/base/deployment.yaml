apiVersion: apps/v1
kind: Deployment
metadata:
  name: limitplane
spec:
  replicas: 2
  selector:
    matchLabels: {app: limitplane}
  template:
    metadata:
      labels: {app: limitplane}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: limitplane
          image: limitplane:latest
          args: ["--config", "/etc/limitplane/config.json", "--trust-proxy"]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: REDIS_URL
              valueFrom: {secretKeyRef: {name: limitplane-secrets, key: redis-url}}
            - name: LIMITPLANE_ADMIN_KEY
              valueFrom: {secretKeyRef: {name: limitplane-secrets, key: admin-key}}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/limitplane, readOnly: true}
      volumes:
        - name: config
          configMap: {name: limitplane-config}
