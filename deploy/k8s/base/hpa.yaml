apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: limitplane
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: limitplane}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
