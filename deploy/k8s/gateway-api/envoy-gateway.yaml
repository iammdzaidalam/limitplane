# Envoy Gateway -> LimitPlane -> your app.
# Assumes Envoy Gateway is installed with a GatewayClass named "eg", and LimitPlane runs in the
# limitplane namespace with --upstream pointing at your app (helm: --set upstream=http://my-app.default.svc).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: limitplane
spec:
  gatewayClassName: eg
  listeners:
    - {name: http, protocol: HTTP, port: 80}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: limitplane
  namespace: limitplane
spec:
  parentRefs:
    - name: public
  hostnames: [api.example.com]
  rules:
    - backendRefs:
        - {name: limitplane, port: 80}
