{{- if not .Values.existingSecret }}
{{- $name := include "limitplane.fullname" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $redis := .Values.redisUrl }}
{{- if and (not $redis) .Values.redis.enabled }}
{{- $redis = printf "redis://%s-redis:6379" $name }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "limitplane.labels" . | nindent 4 }}
type: Opaque
data:
  # Generated keys are reused on upgrade so they don't rotate on every release.
  admin-key: {{ coalesce (b64enc .Values.adminKey) (get $old "admin-key") (randAlphaNum 32 | b64enc) }}
  metrics-key: {{ coalesce (b64enc .Values.metricsKey) (get $old "metrics-key") (randAlphaNum 32 | b64enc) }}
  {{- with $redis }}
  redis-url: {{ b64enc . }}
  {{- end }}
{{- end }}
