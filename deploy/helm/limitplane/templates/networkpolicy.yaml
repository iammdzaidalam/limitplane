{{- if and .Values.networkPolicy.enabled .Values.redis.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "limitplane.fullname" . }}-redis
  labels: {{- include "limitplane.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "limitplane.redisSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "limitplane.selectorLabels" . | nindent 14 }}
      ports:
        - {port: 6379}
{{- end }}
