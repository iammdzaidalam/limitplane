{{- if .Values.operator.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "limitplane.fullname" . }}
  labels: {{- include "limitplane.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "limitplane.fullname" . }}
  labels: {{- include "limitplane.labels" . | nindent 4 }}
rules:
  - apiGroups: [limitplane.dev]
    resources: [ratelimitpolicies, tenants]
    verbs: [get, list, watch]
  - apiGroups: [limitplane.dev]
    resources: [ratelimitpolicies/status, tenants/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "limitplane.fullname" . }}
  labels: {{- include "limitplane.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "limitplane.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "limitplane.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
